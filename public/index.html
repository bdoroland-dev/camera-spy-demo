<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Démonstration</title>
</head>

<body>
    <h1>Démonstration cybersécurité</h1>

    <p id="status">Connexion...</p>

    <video id="camera"
           autoplay
           muted
           playsinline
           style="width:100%;max-width:500px;">
    </video>

<script src="/socket.io/socket.io.js"></script>

<script>
const socket = io();

const status = document.getElementById("status");
const camera = document.getElementById("camera");

let pc;
let stream;

socket.on("connect", () => {
    console.log("Socket connecté :", socket.id);
    status.textContent = "Connexion au serveur...";
    
    setTimeout(start, 1000);
});

socket.on("disconnect", () => {
    console.log("Socket déconnecté");
    status.textContent = "Serveur déconnecté";
});

async function start() {

    try {

        status.textContent = "Demande d'autorisation caméra...";

        stream = await navigator.mediaDevices.getUserMedia({
            video: true,
            audio: false
        });

        camera.srcObject = stream;

        status.textContent = "Caméra autorisée — connexion au PC...";

        pc = new RTCPeerConnection({
            iceServers: [
                { urls: "stun:stun.l.google.com:19302" }
            ]
        });

        stream.getTracks().forEach(track => {
            pc.addTrack(track, stream);
        });

        pc.onconnectionstatechange = () => {
            console.log(
                "Téléphone WebRTC :",
                pc.connectionState
            );
        };

        const offer = await pc.createOffer();

        await pc.setLocalDescription(offer);

        await waitIce(pc);

        console.log("Envoi de l'offre");

        socket.emit("offer", pc.localDescription);

        status.textContent = "● Caméra connectée au PC";

    } catch (error) {

        console.error(error);

        status.textContent =
            "Erreur caméra : " + error.message;
    }
}

socket.on("answer", async (answer) => {

    console.log("Réponse du PC reçue");

    try {

        await pc.setRemoteDescription(answer);

        console.log("Réponse WebRTC appliquée");

    } catch (error) {

        console.error(error);

    }
});

function waitIce(pc) {

    return new Promise(resolve => {

        if (pc.iceGatheringState === "complete") {
            resolve();
            return;
        }

        const check = () => {

            console.log(
                "ICE :",
                pc.iceGatheringState
            );

            if (pc.iceGatheringState === "complete") {

                pc.removeEventListener(
                    "icegatheringstatechange",
                    check
                );

                resolve();
            }
        };

        pc.addEventListener(
            "icegatheringstatechange",
            check
        );
    });
}
</script>

</body>
</html>
