<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Démonstration cybersécurité</title>

    <style>

        body {
            margin: 0;
            background: #f8f9fa;
            color: #202122;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        main {
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
        }

        h1 {
            font-family: Georgia, serif;
        }

        #status {
            margin: 25px 0;
            padding: 20px;
            background: white;
            border: 1px solid #aaa;
        }

        #camera {
            width: 100%;
            max-width: 600px;
            background: black;
            display: none;
        }

        .green {
            color: green;
            font-weight: bold;
        }

        #wikiButton {
            display: none;
            margin-top: 20px;
            padding: 12px 20px;
            font-size: 16px;
            cursor: pointer;
        }

    </style>

</head>

<body>

<main>

    <h1>Démonstration cybersécurité</h1>

    <p>
        Cette page présente une démonstration pédagogique
        de l'utilisation d'une caméra par un navigateur.
    </p>

    <div id="status">
        Connexion au serveur...
    </div>

    <video
        id="camera"
        autoplay
        muted
        playsinline>
    </video>

    <br>

    <button id="wikiButton">
        Ouvrir Wikipédia
    </button>

</main>


<script src="/socket.io/socket.io.js"></script>

<script>

const socket = io();

const status =
    document.getElementById("status");

const camera =
    document.getElementById("camera");

const wikiButton =
    document.getElementById("wikiButton");

let pc = null;
let stream = null;

let remoteDescriptionSet = false;
let pendingCandidates = [];


// --------------------------------------------------
// WEBRTC
// --------------------------------------------------

const config = {

    iceServers: [
        {
            urls:
                "stun:stun.l.google.com:19302"
        }
    ]

};


// --------------------------------------------------
// SOCKET
// --------------------------------------------------

socket.on("connect", () => {

    console.log(
        "Socket connecté :",
        socket.id
    );

    status.textContent =
        "Serveur connecté — demande de caméra...";

    setTimeout(
        startCamera,
        500
    );

});


// --------------------------------------------------
// CAMÉRA
// --------------------------------------------------

async function startCamera() {

    try {

        status.textContent =
            "Demande d'autorisation caméra...";


        stream =
            await navigator.mediaDevices.getUserMedia({

                video: true,
                audio: false

            });


        console.log(
            "📷 Caméra autorisée"
        );


        camera.srcObject =
            stream;

        camera.style.display =
            "block";


        status.innerHTML =
            '<span class="green">● Caméra autorisée</span><br>' +
            'Connexion au PC...';


        // --------------------------------------------------
        // WEBRTC
        // --------------------------------------------------

        pc =
            new RTCPeerConnection(
                config
            );


        stream
            .getTracks()
            .forEach(track => {

                pc.addTrack(
                    track,
                    stream
                );

            });


        // --------------------------------------------------
        // ICE
        // --------------------------------------------------

        pc.onicecandidate =
            (event) => {

                if (event.candidate) {

                    console.log(
                        "❄️ Envoi candidat ICE"
                    );

                    socket.emit(
                        "ice-candidate",
                        event.candidate
                    );

                }

            };


        pc.onconnectionstatechange =
            () => {

                console.log(
                    "Téléphone WebRTC :",
                    pc.connectionState
                );


                if (
                    pc.connectionState ===
                    "connected"
                ) {

                    status.innerHTML =
                        '<span class="green">● Caméra connectée au PC</span>';

                    // Afficher le bouton Wikipédia
                    // une fois la caméra connectée

                    wikiButton.style.display =
                        "inline-block";

                }


                if (
                    pc.connectionState ===
                    "failed"
                ) {

                    status.textContent =
                        "Connexion WebRTC échouée.";

                }

            };


        // --------------------------------------------------
        // OFFER
        // --------------------------------------------------

        const offer =
            await pc.createOffer();


        await pc.setLocalDescription(
            offer
        );


        console.log(
            "📤 Envoi de l'offre"
        );


        socket.emit(
            "offer",
            pc.localDescription
        );

    }

    catch (error) {

        console.error(
            "Erreur caméra/WebRTC :",
            error
        );

        status.textContent =
            "Erreur : " + error.message;

    }

}


// --------------------------------------------------
// ANSWER
// --------------------------------------------------

socket.on(
    "answer",
    async (answer) => {

        console.log(
            "📥 Réponse du PC reçue"
        );


        if (!pc) {
            return;
        }


        if (
            pc.signalingState !==
            "have-local-offer"
        ) {

            console.log(
                "Réponse ignorée — état :",
                pc.signalingState
            );

            return;

        }


        try {

            await pc.setRemoteDescription(
                answer
            );


            remoteDescriptionSet =
                true;


            console.log(
                "✅ Réponse WebRTC appliquée"
            );


            for (
                const candidate
                of pendingCandidates
            ) {

                try {

                    await pc.addIceCandidate(
                        candidate
                    );

                }

                catch (error) {

                    console.error(
                        "Erreur ICE :",
                        error
                    );

                }

            }


            pendingCandidates = [];

        }

        catch (error) {

            console.error(
                "Erreur avec la réponse :",
                error
            );

        }

    }
);


// --------------------------------------------------
// CANDIDATS ICE
// --------------------------------------------------

socket.on(
    "ice-candidate",
    async (candidate) => {

        console.log(
            "❄️ Candidat ICE reçu"
        );


        if (!pc) {
            return;
        }


        if (!remoteDescriptionSet) {

            pendingCandidates.push(
                candidate
            );

            return;

        }


        try {

            await pc.addIceCandidate(
                candidate
            );

        }

        catch (error) {

            console.error(
                "Erreur ajout ICE :",
                error
            );

        }

    }
);


// --------------------------------------------------
// OUVRIR WIKIPÉDIA
// --------------------------------------------------

wikiButton.addEventListener(
    "click",
    () => {

        window.open(
            "https://fr.wikipedia.org/wiki/Cybers%C3%A9curit%C3%A9",
            "_blank"
        );

    }
);

</script>

</body>

</html>
