<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Wikipédia — Démonstration</title>

    <style>
        body {
            margin: 0;
            background: #f8f9fa;
            color: #202122;
            font-family: Arial, sans-serif;
        }

        header {
            background: white;
            border-bottom: 1px solid #a2a9b1;
            padding: 15px 30px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo {
            font-family: Georgia, serif;
            font-size: 42px;
        }

        .title {
            font-size: 22px;
            font-weight: bold;
        }

        main {
            max-width: 950px;
            margin: 30px auto;
            padding: 20px;
        }

        h1 {
            font-family: Georgia, serif;
            font-weight: normal;
            border-bottom: 1px solid #a2a9b1;
            padding-bottom: 10px;
        }

        p {
            line-height: 1.6;
        }

        #status {
            margin-top: 30px;
            padding: 20px;
            background: white;
            border: 1px solid #a2a9b1;
        }

        .green {
            color: #00a000;
            font-weight: bold;
        }

        #localCamera {
            margin-top: 20px;
            width: 100%;
            max-width: 500px;
            display: none;
        }

        button {
            margin-top: 20px;
            padding: 12px 20px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<header>
    <div class="logo">W</div>
    <div class="title">WIKIPÉDIA — Démonstration</div>
</header>

<main>

    <h1>Cybersécurité</h1>

    <p>
        Cette page est une démonstration pédagogique
        utilisant l'accès caméra autorisé par le navigateur.
    </p>

    <div id="status">
        En attente de l'autorisation caméra...
    </div>

    <button id="cameraButton">
        Autoriser la caméra
    </button>

    <video
        id="localCamera"
        autoplay
        muted
        playsinline>
    </video>

</main>

<script src="/socket.io/socket.io.js"></script>

<script>

const socket = io();

const status = document.getElementById("status");
const cameraButton = document.getElementById("cameraButton");
const localCamera = document.getElementById("localCamera");

let peerConnection = null;
let localStream = null;

const config = {
    iceServers: [
        {
            urls: "stun:stun.l.google.com:19302"
        }
    ]
};

cameraButton.addEventListener("click", startCamera);

async function startCamera() {

    cameraButton.disabled = true;

    try {

        localStream = await navigator.mediaDevices.getUserMedia({
            video: true,
            audio: false
        });

        localCamera.srcObject = localStream;
        localCamera.style.display = "block";

        status.innerHTML =
            '<span class="green">● Caméra autorisée</span><br>Connexion au PC...';

        peerConnection = new RTCPeerConnection(config);

        localStream.getTracks().forEach(track => {
            peerConnection.addTrack(track, localStream);
        });

        peerConnection.onicecandidate = event => {

            if (event.candidate) {
                socket.emit("ice-candidate", event.candidate);
            }

        };

        peerConnection.onconnectionstatechange = () => {

            console.log(
                "État WebRTC :",
                peerConnection.connectionState
            );

        };

        const offer = await peerConnection.createOffer();

        await peerConnection.setLocalDescription(offer);

        socket.emit("offer", offer);

        status.innerHTML =
            '<span class="green">● Caméra autorisée</span><br>Flux envoyé au PC.';

    } catch (error) {

        console.error(error);

        cameraButton.disabled = false;

        status.textContent =
            "La caméra n'a pas été autorisée ou est indisponible.";

    }
};

socket.on("answer", async (answer) => {

    if (!peerConnection) {
        return;
    }

    await peerConnection.setRemoteDescription(answer);

});

socket.on("ice-candidate", async (candidate) => {

    if (!peerConnection) {
        return;
    }

    try {
        await peerConnection.addIceCandidate(candidate);
    } catch (error) {
        console.error(error);
    }

});

</script>

</body>
</html>
