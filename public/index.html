<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Démonstration cybersécurité</title>

    <style>
        body {
            margin: 0;
            background: #f8f9fa;
            color: #202122;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        main {
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
        }

        h1 {
            font-family: Georgia, serif;
        }

        #status {
            margin: 25px 0;
            padding: 20px;
            background: white;
            border: 1px solid #aaa;
        }

        #camera {
            width: 100%;
            max-width: 600px;
            background: black;
            display: none;
        }

        .green {
            color: green;
            font-weight: bold;
        }
    </style>
</head>

<body>

<main>

    <h1>Démonstration cybersécurité</h1>

    <p>
        Cette page présente une démonstration pédagogique
        de l'utilisation d'une caméra par un navigateur.
    </p>

    <div id="status">
        Connexion au serveur...
    </div>

    <video
        id="camera"
        autoplay
        muted
        playsinline>
    </video>

</main>

<script src="/socket.io/socket.io.js"></script>

<script>

const socket = io();

const status =
    document.getElementById("status");

const camera =
    document.getElementById("camera");

let pc = null;
let stream = null;

let remoteDescriptionSet = false;
let pendingCandidates = [];


// --------------------------------------------------
// CONFIGURATION WEBRTC
// --------------------------------------------------

const config = {
    iceServers: [
        {
            urls: "stun:stun.l.google.com:19302"
        }
    ]
};


// --------------------------------------------------
// CONNEXION SOCKET
// --------------------------------------------------

socket.on("connect", () => {

    console.log(
        "Socket connecté :",
        socket.id
    );

    status.textContent =
        "Serveur connecté — demande de caméra...";

    setTimeout(
        startCamera,
        500
    );
});


// --------------------------------------------------
// DÉMARRAGE CAMÉRA
// --------------------------------------------------

async function startCamera() {

    try {

        status.textContent =
            "Demande d'autorisation caméra...";


        stream =
            await navigator.mediaDevices.getUserMedia({
                video: true,
                audio: false
            });


        console.log(
            "📷 Caméra autorisée"
        );


        camera.srcObject =
            stream;

        camera.style.display =
            "block";


        status.innerHTML =
            '<span class="green">● Caméra autorisée</span><br>' +
            'Connexion au PC...';


        // --------------------------------------------------
        // CRÉATION CONNEXION WEBRTC
        // --------------------------------------------------

        pc =
            new RTCPeerConnection(config);


        // Ajouter la caméra à WebRTC

        stream
            .getTracks()
            .forEach(track => {

                pc.addTrack(
                    track,
                    stream
                );

            });


        // --------------------------------------------------
        // ENVOI DES CANDIDATS ICE IMMÉDIATEMENT
        // --------------------------------------------------

        pc.onicecandidate = (event) => {

            if (event.candidate) {

                console.log(
                    "❄️ Envoi candidat ICE"
                );

                socket.emit(
                    "ice-candidate",
                    event.candidate
                );

            }

        };


        pc.onconnectionstatechange = () => {

            console.log(
                "Téléphone WebRTC :",
                pc.connectionState
            );


            if (
                pc.connectionState ===
                "connected"
            ) {

                status.innerHTML =
                    '<span class="green">● Caméra connectée au PC</span>';

            }


            if (
                pc.connectionState ===
                "failed"
            ) {

                status.textContent =
                    "Connexion WebRTC échouée.";

            }

        };


        // --------------------------------------------------
        // CRÉATION OFFER
        // --------------------------------------------------

        const offer =
            await pc.createOffer();


        await pc.setLocalDescription(
            offer
        );


        console.log(
            "📤 Envoi de l'offre"
        );


        socket.emit(
            "offer",
            pc.localDescription
        );

    }

    catch (error) {

        console.error(
            "Erreur caméra/WebRTC :",
            error
        );

        status.textContent =
            "Erreur : " + error.message;

    }

}


// --------------------------------------------------
// RÉCEPTION ANSWER
// --------------------------------------------------

socket.on(
    "answer",
    async (answer) => {

        console.log(
            "📥 Réponse du PC reçue"
        );


        if (!pc) {
            return;
        }


        // Évite les réponses en double

        if (
            pc.signalingState !==
            "have-local-offer"
        ) {

            console.log(
                "Réponse ignorée — état :",
                pc.signalingState
            );

            return;

        }


        try {

            await pc.setRemoteDescription(
                answer
            );


            remoteDescriptionSet =
                true;


            console.log(
                "✅ Réponse WebRTC appliquée"
            );


            // Ajouter les candidats
            // reçus trop tôt

            for (
                const candidate
                of pendingCandidates
            ) {

                try {

                    await pc.addIceCandidate(
                        candidate
                    );

                }

                catch (error) {

                    console.error(
                        "Erreur ICE :",
                        error
                    );

                }

            }


            pendingCandidates = [];

        }

        catch (error) {

            console.error(
                "Erreur avec la réponse :",
                error
            );

        }

    }
);


// --------------------------------------------------
// RÉCEPTION CANDIDAT ICE
// --------------------------------------------------

socket.on(
    "ice-candidate",
    async (candidate) => {

        console.log(
            "❄️ Candidat ICE reçu"
        );


        if (!pc) {
            return;
        }


        // Si la description distante
        // n'est pas encore disponible,
        // on garde le candidat.

        if (!remoteDescriptionSet) {

            pendingCandidates.push(
                candidate
            );

            return;
        }


        try {

            await pc.addIceCandidate(
                candidate
            );

        }

        catch (error) {

            console.error(
                "Erreur ajout ICE :",
                error
            );

        }

    }
);

</script>

</body>
</html>
