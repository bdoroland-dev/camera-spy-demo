<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CameraShare</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 30px;
        }

        video {
            width: 100%;
            max-width: 700px;
            background: black;
            border-radius: 12px;
        }

        button {
            padding: 15px 25px;
            margin: 10px;
            font-size: 18px;
        }
    </style>
</head>

<body>

<h1>📷 CameraShare</h1>

<button id="phone">📱 Utiliser ce téléphone comme caméra</button>
<button id="computer">💻 Voir la caméra du téléphone</button>

<p id="status">Déconnecté</p>

<video id="video" autoplay muted playsinline></video>

<script src="/socket.io/socket.io.js"></script>

<script>

const socket = io();

const video = document.getElementById("video");
const status = document.getElementById("status");

let peerConnection;

const config = {
    iceServers: [
        {
            urls: "stun:stun.l.google.com:19302"
        }
    ]
};

function createPeerConnection() {

    peerConnection = new RTCPeerConnection(config);

    peerConnection.onicecandidate = event => {

        if (event.candidate) {
            socket.emit("ice-candidate", event.candidate);
        }

    };

    peerConnection.ontrack = event => {
        video.srcObject = event.streams[0];
    };
}


// 📱 TÉLÉPHONE

document.getElementById("phone").onclick = async () => {

    try {

        const stream = await navigator.mediaDevices.getUserMedia({
            video: true,
            audio: false
        });

        video.srcObject = stream;

        createPeerConnection();

        stream.getTracks().forEach(track => {
            peerConnection.addTrack(track, stream);
        });

        const offer = await peerConnection.createOffer();

        await peerConnection.setLocalDescription(offer);

        socket.emit("offer", offer);

        status.textContent = "🟢 Caméra du téléphone active";

    } catch (error) {

        console.error(error);

        status.textContent =
            "🔴 Impossible d'accéder à la caméra";

    }
};


// 💻 ORDINATEUR

document.getElementById("computer").onclick = async () => {

    createPeerConnection();

    status.textContent = "🟡 Connexion au téléphone...";

};


// Réception de l'offre du téléphone

socket.on("offer", async offer => {

    if (!peerConnection) {
        createPeerConnection();
    }

    await peerConnection.setRemoteDescription(
        new RTCSessionDescription(offer)
    );

    const answer = await peerConnection.createAnswer();

    await peerConnection.setLocalDescription(answer);

    socket.emit("answer", answer);

    status.textContent = "🟢 Connexion établie";

});


// Réception de la réponse

socket.on("answer", async answer => {

    await peerConnection.setRemoteDescription(
        new RTCSessionDescription(answer)
    );

});


// ICE

socket.on("ice-candidate", async candidate => {

    try {

        await peerConnection.addIceCandidate(
            new RTCIceCandidate(candidate)
        );

    } catch (error) {

        console.error(error);

    }

});

</script>

</body>
</html>
