<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Démonstration cybersécurité</title>

    <style>
        body {
            margin: 0;
            background: #f8f9fa;
            color: #202122;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        main {
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
        }

        h1 {
            font-family: Georgia, serif;
        }

        #status {
            margin: 25px 0;
            padding: 20px;
            background: white;
            border: 1px solid #aaa;
        }

        #camera {
            width: 100%;
            max-width: 600px;
            background: black;
            display: none;
        }

        .green {
            color: green;
            font-weight: bold;
        }
    </style>
</head>

<body>

<main>

    <h1>Démonstration cybersécurité</h1>

    <p>
        Cette page présente une démonstration pédagogique
        de l'utilisation d'une caméra par un navigateur.
    </p>

    <div id="status">
        Connexion au serveur...
    </div>

    <video
        id="camera"
        autoplay
        muted
        playsinline>
    </video>

</main>

<script src="/socket.io/socket.io.js"></script>

<script>

const socket = io();

const status =
    document.getElementById("status");

const camera =
    document.getElementById("camera");

let pc = null;
let stream = null;
let answerReceived = false;

const config = {
    iceServers: [
        {
            urls: "stun:stun.l.google.com:19302"
        }
    ]
};


// --------------------------------------------------
// CONNEXION SOCKET
// --------------------------------------------------

socket.on("connect", () => {

    console.log(
        "Socket connecté :",
        socket.id
    );

    status.textContent =
        "Serveur connecté — demande de caméra...";

    setTimeout(
        startCamera,
        1000
    );
});


// --------------------------------------------------
// CAMÉRA
// --------------------------------------------------

async function startCamera() {

    try {

        status.textContent =
            "Demande d'autorisation caméra...";

        stream =
            await navigator.mediaDevices.getUserMedia({
                video: true,
                audio: false
            });

        console.log(
            "Caméra autorisée"
        );

        camera.srcObject = stream;

        camera.style.display =
            "block";

        status.innerHTML =
            '<span class="green">● Caméra autorisée</span><br>' +
            'Connexion au PC...';


        // --------------------------------------------------
        // WEBRTC
        // --------------------------------------------------

        pc =
            new RTCPeerConnection(config);


        stream
            .getTracks()
            .forEach(track => {

                pc.addTrack(
                    track,
                    stream
                );

            });


        pc.onconnectionstatechange = () => {

            console.log(
                "Téléphone WebRTC :",
                pc.connectionState
            );

            if (
                pc.connectionState ===
                "connected"
            ) {

                status.innerHTML =
                    '<span class="green">● Caméra connectée au PC</span>';

            }

        };


        // --------------------------------------------------
        // CRÉATION OFFER
        // --------------------------------------------------

        const offer =
            await pc.createOffer();

        await pc.setLocalDescription(
            offer
        );


        // Attendre que les candidats ICE
        // soient intégrés au SDP

        await waitForIceGatheringComplete(
            pc
        );


        console.log(
            "Envoi de l'offre"
        );

        socket.emit(
            "offer",
            pc.localDescription
        );

    }

    catch (error) {

        console.error(
            "Erreur caméra/WebRTC :",
            error
        );

        status.textContent =
            "Erreur : " + error.message;

    }

}


// --------------------------------------------------
// RÉCEPTION DE LA RÉPONSE DU PC
// --------------------------------------------------

socket.on(
    "answer",
    async (answer) => {

        console.log(
            "Réponse du PC reçue"
        );


        // Si une réponse a déjà été appliquée,
        // on ignore les suivantes.

        if (answerReceived) {

            console.log(
                "Réponse supplémentaire ignorée"
            );

            return;
        }


        if (!pc) {

            console.log(
                "Aucune connexion WebRTC"
            );

            return;
        }


        // L'answer n'est valable que lorsque
        // le téléphone possède encore son offer.

        if (
            pc.signalingState !==
            "have-local-offer"
        ) {

            console.log(
                "Réponse ignorée. État WebRTC :",
                pc.signalingState
            );

            return;
        }


        try {

            await pc.setRemoteDescription(
                answer
            );

            answerReceived = true;

            console.log(
                "Réponse WebRTC appliquée"
            );

        }

        catch (error) {

            console.error(
                "Erreur avec la réponse WebRTC :",
                error
            );

        }

    }
);


// --------------------------------------------------
// ATTENTE ICE
// --------------------------------------------------

function waitForIceGatheringComplete(pc) {

    return new Promise(resolve => {

        if (
            pc.iceGatheringState ===
            "complete"
        ) {

            resolve();

            return;
        }


        function checkState() {

            console.log(
                "ICE :",
                pc.iceGatheringState
            );


            if (
                pc.iceGatheringState ===
                "complete"
            ) {

                pc.removeEventListener(
                    "icegatheringstatechange",
                    checkState
                );

                resolve();

            }

        }


        pc.addEventListener(
            "icegatheringstatechange",
            checkState
        );

    });

}

</script>

</body>
</html>
