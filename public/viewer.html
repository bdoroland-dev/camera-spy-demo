<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>CameraShare</title>

    <style>

        body {
            background:#111;
            color:white;
            font-family:Arial;
            text-align:center;
        }

        video {
            width:90%;
            max-width:1000px;
            margin-top:20px;
            background:black;
        }

    </style>
</head>

<body>

<h1>CameraShare — PC</h1>

<div id="status">
    En attente du téléphone...
</div>

<video id="video"
       autoplay
       muted
       playsinline>
</video>

<script src="/socket.io/socket.io.js"></script>

<script>

const socket = io();

const status =
    document.getElementById("status");

const video =
    document.getElementById("video");

let pc;

socket.on("connect", () => {

    console.log(
        "Socket PC connecté :",
        socket.id
    );

    status.textContent =
        "En attente du téléphone...";

});

socket.on("offer", async (offer) => {

    console.log("📱 OFFER REÇUE");

    status.textContent =
        "Téléphone détecté...";

    pc = new RTCPeerConnection({
        iceServers: [
            { urls: "stun:stun.l.google.com:19302" }
        ]
    });

    pc.onconnectionstatechange = () => {

        console.log(
            "PC WebRTC :",
            pc.connectionState
        );

        status.textContent =
            "WebRTC : " + pc.connectionState;
    };

    pc.ontrack = async (event) => {

        console.log("🎥 FLUX VIDÉO REÇU");

        video.srcObject = event.streams[0];

        try {
            await video.play();
            console.log("▶ Vidéo démarrée");
        } catch (error) {
            console.error(
                "Erreur lecture vidéo :",
                error
            );
        }
    };

    await pc.setRemoteDescription(offer);

    const answer =
        await pc.createAnswer();

    await pc.setLocalDescription(answer);

    await waitIce(pc);

    console.log("Envoi de la réponse");

    socket.emit(
        "answer",
        pc.localDescription
    );

});

function waitIce(pc) {

    return new Promise(resolve => {

        if (pc.iceGatheringState === "complete") {
            resolve();
            return;
        }

        const check = () => {

            console.log(
                "ICE :",
                pc.iceGatheringState
            );

            if (pc.iceGatheringState === "complete") {

                pc.removeEventListener(
                    "icegatheringstatechange",
                    check
                );

                resolve();
            }
        };

        pc.addEventListener(
            "icegatheringstatechange",
            check
        );
    });
}

</script>

</body>
</html>
