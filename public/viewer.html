peerConnection.ontrack = event => {

    video.srcObject = event.streams[0];

    video.onloadedmetadata = async () => {
        try {
            await video.play();
        } catch (error) {
            console.error("Lecture vidéo bloquée :", error);
        }
    };

    status.textContent = "● Flux caméra reçu";
};
