<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CameraShare — Récepteur PC</title>

    <style>
        body {
            margin: 0;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        h1 {
            margin: 30px;
        }

        #status {
            margin: 20px;
            font-size: 18px;
        }

        #remoteVideo {
            width: 90%;
            max-width: 1000px;
            min-height: 300px;
            background: black;
            border-radius: 10px;
            object-fit: contain;
        }

        #startVideo {
            padding: 12px 25px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<h1>CameraShare — Récepteur PC</h1>

<div id="status">
    En attente du téléphone...
</div>

<button id="startVideo" disabled>
    Connexion...
</button>

<br><br>

<video
    id="remoteVideo"
    autoplay
    muted
    playsinline>
</video>

<script src="/socket.io/socket.io.js"></script>

<script>

const socket = io();

const video = document.getElementById("remoteVideo");
const status = document.getElementById("status");
const startVideo = document.getElementById("startVideo");

let peerConnection = null;
let remoteStream = null;

const config = {
    iceServers: [
        {
            urls: "stun:stun.l.google.com:19302"
        }
    ]
};

socket.on("offer", async (offer) => {

    console.log("Offer reçue");

    status.textContent = "Connexion au téléphone...";

    peerConnection = new RTCPeerConnection(config);

    peerConnection.ontrack = (event) => {

        console.log("Flux vidéo reçu");

        if (!remoteStream) {
            remoteStream = new MediaStream();
            video.srcObject = remoteStream;
        }

        remoteStream.addTrack(event.track);

        status.textContent =
            "Flux reçu — connexion en cours...";
    };

    peerConnection.onicecandidate = (event) => {

        if (event.candidate) {
            socket.emit("ice-candidate", event.candidate);
        }
    };

    peerConnection.onconnectionstatechange = () => {

        console.log(
            "WebRTC :",
            peerConnection.connectionState
        );

        if (
            peerConnection.connectionState === "connected"
        ) {

            status.textContent =
                "● Flux caméra connecté";

            startVideo.disabled = false;
            startVideo.textContent =
                "Afficher le flux vidéo";
        }

        if (
            peerConnection.connectionState === "failed"
        ) {

            status.textContent =
                "Connexion WebRTC échouée";

        }
    };

    await peerConnection.setRemoteDescription(offer);

    const answer =
        await peerConnection.createAnswer();

    await peerConnection.setLocalDescription(answer);

    socket.emit("answer", answer);
});

socket.on("ice-candidate", async (candidate) => {

    if (!peerConnection) {
        return;
    }

    try {
        await peerConnection.addIceCandidate(candidate);
    } catch (error) {
        console.error("Erreur ICE :", error);
    }
});

startVideo.addEventListener("click", async () => {

    console.log("Bouton vidéo cliqué");

    try {

        await video.play();

        startVideo.style.display = "none";

        status.textContent =
            "● Flux caméra affiché";

    } catch (error) {

        console.error(
            "Erreur lecture vidéo :",
            error
        );

        status.textContent =
            "Impossible de lire le flux vidéo.";

    }
});

</script>

</body>
</html>
